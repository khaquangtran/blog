<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Two paths for replaying streaming logic</title>
  <desc id="desc">Uber's SQL mode compiles the same SQL for live Flink DataStream and batch Flink DataSet jobs. Kappa+ reuses streaming API code against archived Hive data with bounded-range and ordering adaptations.</desc>
  <rect width="1200" height="620" fill="#101b1e"/>
  <path d="M36 54h1128M36 580h1128" stroke="#405154" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" font-size="16" letter-spacing="2"><text x="42" y="38">08 / BACKFILL · REUSE WITHOUT PRETENDING IT IS IDENTICAL</text><text x="1158" y="38" text-anchor="end">SQL MODE + KAPPA+</text></g>
  <g fill="#152327" stroke="#405154" stroke-width="2"><rect x="54" y="92" width="526" height="430"/><rect x="620" y="92" width="526" height="430"/></g>
  <g fill="#e77d5e" font-family="monospace" font-size="13" letter-spacing="1.5"><text x="80" y="126">A / SQL MODE</text><text x="646" y="126">B / KAPPA+ API</text></g>
  <rect x="132" y="154" width="370" height="66" fill="#24373a" stroke="#ecebe3" stroke-width="2"/><text x="317" y="183" text-anchor="middle" fill="#ecebe3" font-family="monospace" font-size="18">ONE SQL QUERY</text><text x="317" y="204" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">Calcite compiles for two execution modes</text>
  <path d="M317 220v34M317 254H188v28m129-28h128v28" fill="none" stroke="#e77d5e" stroke-width="2"/><path d="M180 273l8 9 8-9M438 273l8 9 8-9" fill="none" stroke="#e77d5e" stroke-width="2"/>
  <g fill="#101b1e" stroke="#405154" stroke-width="2"><rect x="86" y="282" width="204" height="108"/><rect x="344" y="282" width="204" height="108"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="188" y="320" font-size="15">LIVE</text><text x="188" y="345" font-size="11" fill="#aab7b0">Kafka → Flink DataStream</text><text x="188" y="368" font-size="10">unbounded · event time</text><text x="446" y="320" font-size="15">HISTORICAL</text><text x="446" y="345" font-size="11" fill="#aab7b0">Hive → Flink DataSet</text><text x="446" y="368" font-size="10">bounded · archived files</text></g>
  <path d="M188 390v28h129m129-28v28H317" fill="none" stroke="#80c7a3" stroke-width="2" stroke-dasharray="6 7"/><path d="M309 411l8 9 8-9" fill="none" stroke="#80c7a3" stroke-width="2"/><rect x="228" y="420" width="178" height="54" fill="#24373a"/><text x="317" y="443" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">COMPARE OUTPUTS</text><text x="317" y="461" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="9">validate semantic parity</text>
  <rect x="698" y="154" width="370" height="66" fill="#24373a" stroke="#ecebe3" stroke-width="2"/><text x="883" y="183" text-anchor="middle" fill="#ecebe3" font-family="monospace" font-size="18">STREAMING API</text><text x="883" y="204" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">reuse computation code where possible</text>
  <path d="M883 220v34M883 254H754v28m129-28h128v28" fill="none" stroke="#e77d5e" stroke-width="2"/><path d="M746 273l8 9 8-9M1004 273l8 9 8-9" fill="none" stroke="#e77d5e" stroke-width="2"/>
  <g fill="#101b1e" stroke="#405154" stroke-width="2"><rect x="652" y="282" width="204" height="108"/><rect x="910" y="282" width="204" height="108"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="754" y="320" font-size="15">LIVE INPUT</text><text x="754" y="345" font-size="11" fill="#aab7b0">Kafka stream</text><text x="754" y="368" font-size="10">open-ended · continuous</text><text x="1012" y="320" font-size="15">REPLAY INPUT</text><text x="1012" y="345" font-size="11" fill="#aab7b0">Hive archive</text><text x="1012" y="368" font-size="10">bounded range · throttled</text></g>
  <path d="M754 390v35h129m129-35v35H883" fill="none" stroke="#80c7a3" stroke-width="2" stroke-dasharray="6 7"/><path d="M875 433l8 7 8-7" fill="none" stroke="#80c7a3" stroke-width="2"/><rect x="698" y="440" width="370" height="54" fill="#24373a"/><text x="883" y="462" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">ADAPT WINDOWS · ORDERING · MEMORY</text><text x="883" y="480" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="9">the paper describes this as work in progress</text>
  <text x="42" y="554" fill="#e77d5e" font-family="monospace" font-size="11" letter-spacing="1">SAME INTENT DOES NOT REMOVE THE DIFFERENCES BETWEEN LIVE AND BOUNDED EXECUTION</text>
</svg>
