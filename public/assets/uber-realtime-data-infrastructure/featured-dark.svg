<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Uber real-time data platform map</title>
  <desc id="desc">Regional event streams enter a federated Kafka platform, flow through Flink into Pinot, and branch to HDFS for history.</desc>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2b3937"/></pattern></defs>
