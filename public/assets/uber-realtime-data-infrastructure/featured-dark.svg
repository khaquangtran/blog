  <path d="M42 54h1116M42 574h1116" stroke="#354443" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" font-size="17" letter-spacing="2"><text x="54" y="39">FIELD NOTE / REAL-TIME DATA</text><text x="1146" y="39" text-anchor="end">UBER · SIGMOD ’21</text></g>
  <g fill="#aab7b0" font-family="monospace" font-size="13" letter-spacing="1"><text x="66" y="116">REGIONAL SOURCES</text><text x="375" y="116">MESSAGE BUS</text><text x="676" y="116">STREAM COMPUTE</text><text x="960" y="116">ANALYTICS</text></g>
