<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Pinot query scatter and gather path</title>
  <desc id="desc">A client sends SQL to a Pinot broker. The broker fans the query out to servers holding segments. Servers use local indexes and send partial results back for the broker to merge.</desc>
  <rect width="1200" height="600" fill="#f2efe6"/>
  <path d="M36 54h1128M36 558h1128" stroke="#c9c9bf" stroke-width="2"/>
  <g fill="#536e6c" font-family="monospace" font-size="16" letter-spacing="2"><text x="42" y="38">04 / PINOT · SCATTER, GATHER, MERGE</text><text x="1158" y="38" text-anchor="end">QUERY THE SERVING INDEX</text></g>
  <g fill="#f7f5ee" stroke="#243a3b" stroke-width="2"><rect x="54" y="222" width="190" height="104"/><rect x="342" y="222" width="218" height="104"/><rect x="718" y="90" width="402" height="102"/><rect x="718" y="222" width="402" height="102"/><rect x="718" y="354" width="402" height="102"/></g>
  <g fill="#243a3b" font-family="monospace" text-anchor="middle"><text x="149" y="255" font-size="18">PRESTO / SQL</text><text x="149" y="283" font-size="12" fill="#536e6c">client query</text><text x="451" y="255" font-size="19">PINOT BROKER</text><text x="451" y="283" font-size="12" fill="#536e6c">route + merge</text><text x="919" y="124" font-size="17">SERVER A</text><text x="919" y="256" font-size="17">SERVER B</text><text x="919" y="388" font-size="17">SERVER C</text></g>
  <g fill="#e8e5db"><rect x="746" y="145" width="346" height="28"/><rect x="746" y="277" width="346" height="28"/><rect x="746" y="409" width="346" height="28"/></g>
  <g fill="#536e6c" font-family="monospace" font-size="13" text-anchor="middle"><text x="919" y="164">SEGMENTS + LOCAL INDEXES</text><text x="919" y="296">SEGMENTS + LOCAL INDEXES</text><text x="919" y="428">SEGMENTS + LOCAL INDEXES</text></g>
  <g fill="none" stroke="#bd4b31" stroke-width="2.5"><path d="M244 252h98"/><path d="M560 250H624V141H718M624 274H718M624 298V405H718"/><path d="M331 243l11 9-11 9M707 132l11 9-11 9M707 265l11 9-11 9M707 396l11 9-11 9"/></g>
  <g fill="none" stroke="#78928d" stroke-width="2"><path d="M718 166H666V232H560M718 298H560M718 430H666V316H560"/><path d="M568 225l-8 7 8 7M568 291l-8 7 8 7M568 309l-8 7 8 7"/><path d="M342 292H244"/><path d="M255 285l-11 7 11 7"/></g>
  <g fill="#e8e5db" stroke="#bfc4ba" stroke-width="2"><rect x="54" y="476" width="1100" height="58"/></g>
  <g fill="#536e6c" font-family="monospace"><text x="76" y="500" font-size="11" letter-spacing="1">INDEX CHOICES</text><text x="76" y="520" font-size="10">INVERTED · RANGE · SORTED · STAR-TREE</text><text x="542" y="500" font-size="11" letter-spacing="1">TRADE-OFF</text><text x="542" y="520" font-size="10">less query work costs storage and ingestion effort</text></g>
  <text x="42" y="552" fill="#bd4b31" font-family="monospace" font-size="11" letter-spacing="1">BROKER FANS OUT · SERVERS RETURN PARTIALS · BROKER MERGES THE ANSWER</text>
</svg>
