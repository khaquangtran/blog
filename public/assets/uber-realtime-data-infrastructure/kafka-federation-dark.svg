  <g fill="#152327" stroke="#ecebe3" stroke-width="2"><rect x="58" y="104" width="212" height="82"/><rect x="344" y="104" width="798" height="82"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="164" y="139" font-size="17">PRODUCERS</text><text x="164" y="164" font-size="11" fill="#aab7b0">publish by topic name</text><text x="743" y="139" font-size="18">TOPIC DIRECTORY</text><text x="743" y="164" font-size="11" fill="#aab7b0">metadata maps each topic to its physical owner</text></g>
