<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Federated Kafka routing and reliability</title>
  <desc id="desc">A logical topic directory routes clients to physical Kafka clusters. uReplicator copies between clusters, a consumer proxy handles delivery and dead-letter routing, and Chaperone audits counts.</desc>
