<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pinot key ownership and asynchronous segment recovery</title>
  <desc id="desc">An update is routed by primary key to one owning partition, keeping reads and writes aligned. For recovery, a healthy peer asynchronously transfers a segment to a replacement server.</desc>
  <rect width="1200" height="560" fill="#101b1e"/>
  <path d="M36 54h1128M36 538h1128" stroke="#405154" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" font-size="16" letter-spacing="2"><text x="42" y="38">05 / PINOT · OWNERSHIP AND RECOVERY</text><text x="1158" y="38" text-anchor="end">PARTITION THE WORK · REPAIR FROM PEERS</text></g>
  <g fill="#152327" stroke="#405154" stroke-width="2"><rect x="52" y="86" width="536" height="414"/><rect x="612" y="86" width="536" height="414"/></g>
  <g fill="#e77d5e" font-family="monospace" font-size="13" letter-spacing="1.5"><text x="78" y="120">A / UPSERTS FOLLOW THE PRIMARY KEY</text><text x="638" y="120">B / REPLICAS RECOVER ASYNCHRONOUSLY</text></g>

  <g fill="#101b1e" stroke="#ecebe3" stroke-width="2"><rect x="80" y="172" width="132" height="112"/><rect x="254" y="172" width="132" height="112"/><rect x="428" y="172" width="132" height="112"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="146" y="207" font-size="15">UPDATE</text><text x="146" y="233" font-size="11" fill="#aab7b0">key = store_42</text><text x="146" y="254" font-size="10" fill="#aab7b0">version = 18</text><text x="320" y="207" font-size="14">PARTITION</text><text x="320" y="233" font-size="11" fill="#aab7b0">hash(key) → p2</text><text x="320" y="254" font-size="10" fill="#aab7b0">stable routing</text><text x="494" y="207" font-size="14">OWNER / S2</text><text x="494" y="233" font-size="10" fill="#aab7b0">key map + latest row</text><text x="494" y="254" font-size="10" fill="#aab7b0">apply version 18</text></g>
  <g fill="none" stroke="#e77d5e" stroke-width="2.5"><path d="M212 228h42M386 228h42"/><path d="M243 221l11 7-11 7M417 221l11 7-11 7"/></g>
  <path d="M320 284v44h174v-44" fill="none" stroke="#80c7a3" stroke-width="2" stroke-dasharray="6 7"/><path d="M487 293l7-9 7 9" fill="none" stroke="#80c7a3" stroke-width="2"/><text x="407" y="348" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="9">READS ALSO ROUTE TO THE OWNER</text>
  <rect x="92" y="366" width="456" height="74" fill="#24373a" stroke="#405154" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" text-anchor="middle"><text x="320" y="395" font-size="12" letter-spacing="1">ONE KEY · ONE OWNER</text><text x="320" y="419" font-size="10">updates and partition-aware reads meet at S2</text></g>
  <text x="78" y="472" fill="#aab7b0" font-family="monospace" font-size="10">SHARED-NOTHING ROUTING LIMITS CROSS-SERVER COORDINATION</text>

  <g fill="#101b1e" stroke="#ecebe3" stroke-width="2"><rect x="646" y="172" width="132" height="112"/><rect x="820" y="172" width="132" height="112"/><rect x="994" y="172" width="132" height="112"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="712" y="207" font-size="14">SERVER S1</text><text x="712" y="237" font-size="11" fill="#e77d5e">UNAVAILABLE</text><text x="886" y="207" font-size="14">SERVER S2</text><text x="886" y="233" font-size="10" fill="#aab7b0">healthy replica</text><text x="886" y="255" font-size="10" fill="#aab7b0">segment 17</text><text x="1060" y="207" font-size="14">SERVER S3</text><text x="1060" y="233" font-size="10" fill="#aab7b0">replacement</text><text x="1060" y="255" font-size="10" fill="#aab7b0">recovering</text></g>
  <path d="M676 222l72 42m0-42-72 42" stroke="#e77d5e" stroke-width="3"/>
  <path d="M952 228h42" fill="none" stroke="#e77d5e" stroke-width="2.5"/><path d="M983 221l11 7-11 7" fill="none" stroke="#e77d5e" stroke-width="2.5"/>
  <text x="973" y="205" text-anchor="middle" fill="#e77d5e" font-family="monospace" font-size="8">ASYNC</text>
  <rect x="654" y="366" width="452" height="74" fill="#24373a" stroke="#405154" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" text-anchor="middle"><text x="880" y="395" font-size="12" letter-spacing="1">PEER-TO-PEER SEGMENT COPY</text><text x="880" y="419" font-size="10">recovery does not wait on a central synchronous archive step</text></g>
  <text x="638" y="472" fill="#aab7b0" font-family="monospace" font-size="10">REPLICA COMPLETENESS STILL NEEDS OPERATIONAL VISIBILITY</text>
</svg>
