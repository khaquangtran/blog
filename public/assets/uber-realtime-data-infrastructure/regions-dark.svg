<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Active-active and active-passive regional designs</title>
  <desc id="desc">Surge independently recomputes in two regions and selects one primary writer. A strong-consistency consumer replicates events and maps offsets so a standby can resume from the last synchronized position.</desc>
  <rect width="1200" height="580" fill="#101b1e"/>
  <path d="M36 54h1128M36 542h1128" stroke="#405154" stroke-width="2"/>
  <g fill="#aab7b0" font-family="monospace" font-size="16" letter-spacing="2"><text x="42" y="38">07 / MULTI-REGION · TWO FAILURE CONTRACTS</text><text x="1158" y="38" text-anchor="end">RECOMPUTE OR RESUME</text></g>
  <g fill="#152327" stroke="#405154" stroke-width="2"><rect x="52" y="86" width="536" height="424"/><rect x="612" y="86" width="536" height="424"/></g>
  <g fill="#e77d5e" font-family="monospace" font-size="13" letter-spacing="1.5"><text x="78" y="120">A / ACTIVE-ACTIVE · SURGE PRICING</text><text x="638" y="120">B / ACTIVE-PASSIVE · PAYMENT / AUDIT</text></g>
  <g fill="#24373a" stroke="#405154" stroke-width="2"><rect x="90" y="160" width="204" height="110"/><rect x="346" y="160" width="204" height="110"/><rect x="720" y="160" width="176" height="110"/><rect x="954" y="160" width="158" height="110"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="192" y="195" font-size="16">REGION A</text><text x="192" y="221" font-size="11" fill="#aab7b0">Kafka → Flink</text><text x="448" y="195" font-size="16">REGION B</text><text x="448" y="221" font-size="11" fill="#aab7b0">Kafka → Flink</text><text x="808" y="195" font-size="15">SOURCE</text><text x="808" y="221" font-size="11" fill="#aab7b0">active consumer</text><text x="1033" y="195" font-size="15">DESTINATION</text><text x="1033" y="221" font-size="11" fill="#aab7b0">standby consumer</text></g>
  <path d="M294 214h52" fill="none" stroke="#80c7a3" stroke-width="2" stroke-dasharray="5 5"/><path d="m336 207 10 7-10 7" fill="none" stroke="#80c7a3" stroke-width="2"/><text x="320" y="198" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="9">SAME INPUT</text>
  <path d="M896 214h58" fill="none" stroke="#e77d5e" stroke-width="2"/><path d="M947 207l9 7-9 7" fill="none" stroke="#e77d5e" stroke-width="2"/><text x="925" y="198" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="9">UREPLICATOR</text>
  <g fill="#101b1e" stroke="#405154" stroke-width="2"><rect x="650" y="320" width="145" height="70"/><rect x="830" y="320" width="160" height="70"/><rect x="1020" y="320" width="100" height="70"/></g>
  <g fill="#ecebe3" font-family="monospace" text-anchor="middle"><text x="722" y="348" font-size="12">SOURCE</text><text x="722" y="369" font-size="10" fill="#aab7b0">offset</text><text x="910" y="348" font-size="12">OFFSET SYNC</text><text x="910" y="369" font-size="10" fill="#aab7b0">map progress</text><text x="1070" y="348" font-size="11">DEST</text><text x="1070" y="369" font-size="10" fill="#aab7b0">offset</text></g>
  <path d="M808 270v26H722v24M1033 270v50M795 355h35m160 0h30" fill="none" stroke="#80c7a3" stroke-width="2"/><path d="M715 311l7 9 7-9M823 348l7 7-7 7M1013 348l7 7-7 7" fill="none" stroke="#80c7a3" stroke-width="2"/>
  <text x="885" y="421" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">ON FAILURE, ACTIVATE FROM THE LAST SYNCHRONIZED OFFSET</text>
  <path d="M192 270v30h133M448 270v30H325v34" fill="none" stroke="#e77d5e" stroke-width="2"/><path d="M318 327l7 7 7-7" fill="none" stroke="#e77d5e" stroke-width="2"/>
  <rect x="146" y="334" width="358" height="74" fill="#101b1e" stroke="#ecebe3" stroke-width="2"/><text x="325" y="365" text-anchor="middle" fill="#ecebe3" font-family="monospace" font-size="15">ONE PRIMARY WRITER</text><text x="325" y="389" text-anchor="middle" fill="#aab7b0" font-family="monospace" font-size="10">regional jobs recompute; state is not copied</text>
  <g fill="#aab7b0" font-family="monospace" font-size="10"><text x="78" y="451">DUPLICATE COMPUTE COST · STATE RECOMPUTED PER REGION</text><text x="638" y="451">SINGLE ACTIVE CONSUMER · OFFSET-ALIGNED TAKEOVER</text></g>
  <text x="42" y="526" fill="#e77d5e" font-family="monospace" font-size="11" letter-spacing="1">ACTIVE-ACTIVE FAVORS CONTINUITY · ACTIVE-PASSIVE FAVORS A SINGLE ORDERED OWNER</text>
</svg>
